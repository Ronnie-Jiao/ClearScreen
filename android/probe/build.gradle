apply plugin: 'com.android.application'

def clearScreenSigning = rootProject.ext.clearScreenSigning
def allowDebugSigning = (findProperty('allowDebugSigning') ?: 'false').toBoolean()

android {
    namespace 'com.clearscreen.probe'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId 'com.clearscreen.probe'
        minSdkVersion rootProject.ext.minSdkVersion
        def probeTargetSdk = findProperty('probeTargetSdk') ?: (rootProject.ext.has('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36)
        targetSdkVersion probeTargetSdk.toInteger()
        // Increment this isolated test APK so it can be updated in place on the device.
        versionCode 4
        versionName '0.1.3-ltt-lifecycle'
    }

    signingConfigs {
        debug {
            storeFile file('../app/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (clearScreenSigning.configured) {
                storeFile rootProject.file(clearScreenSigning.storeFile)
                storePassword clearScreenSigning.storePassword
                keyAlias clearScreenSigning.keyAlias
                keyPassword clearScreenSigning.keyPassword
                // The installed LiTiaotiao APK carries both v2 and v3 signatures.
                // Keep this only on the isolated comparison probe so the test changes
                // one package-identity characteristic without touching the app logic.
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (clearScreenSigning.configured) {
                signingConfig signingConfigs.release
            } else if (allowDebugSigning) {
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
        }
    }
}
